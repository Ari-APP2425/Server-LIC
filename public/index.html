<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Licencat — Panel</title>
<style>
  :root {
    --bg: #12171b; --panel: #1b2228; --panel2: #212a31; --line: #2c363e;
    --text: #edf1f2; --muted: #8a9aa3; --jade: #3fa796; --red: #e8604c; --amber: #e8a33d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif; min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 20px; }
  input, select { background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 9px 12px; font-size: 13.5px; font-family: inherit; outline: none; }
  button { cursor: pointer; border: none; border-radius: 9px; font-weight: 700; font-size: 13px;
    padding: 9px 16px; font-family: inherit; }
  .btn-primary { background: var(--jade); color: #0d1512; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .btn-danger { background: transparent; border: 1px solid var(--red); color: var(--red); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 12px; color: var(--muted); font-size: 11px; letter-spacing: .4px;
    border-bottom: 1px solid var(--line); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 7px; }
  .dot.on { background: var(--jade); box-shadow: 0 0 8px #3fa79688; }
  .dot.off { background: #4a545c; }
  .pill { padding: 3px 9px; border-radius: 6px; font-weight: 700; font-size: 11px; }
  .pill.ok { background: #3fa79622; color: var(--jade); }
  .pill.warn { background: #e8a33d22; color: var(--amber); }
  .pill.bad { background: #e8604c22; color: var(--red); }
  .key { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); cursor: pointer; }
  .editable { cursor: text; border-radius: 6px; }
  .editable:hover { background: var(--panel2); }
  .editable input { background: var(--panel2); border: 1px solid var(--jade); color: var(--text);
    border-radius: 6px; padding: 5px 8px; font-size: 13px; font-family: inherit; width: 100%; outline: none; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .gate { max-width: 360px; margin: 100px auto; }
  .field-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; }
  #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--panel2);
    border: 1px solid var(--jade); padding: 10px 18px; border-radius: 10px; font-size: 13px; display: none; }
</style>
</head>
<body>

<div id="gate" class="wrap gate card">
  <h1>Hyrje në Panel</h1>
  <div class="sub">Vendos fjalëkalimin admin të serverit të licencave.</div>
  <div class="field-label">Fjalëkalimi (ADMIN_KEY)</div>
  <input id="adminKeyInput" type="password" style="width:100%; margin-bottom:12px;" />
  <button class="btn-primary" style="width:100%" onclick="login()">Hyr</button>
</div>

<div id="app" class="wrap" style="display:none;">
  <h1>Licencat</h1>
  <div class="sub">Statusi i të gjitha programeve — online sinkronizohet automatikisht çdo 15 sekonda.</div>

  <div class="card">
    <div class="field-label">Krijo Licencë të Re</div>
    <div class="grid" style="margin-bottom:10px;">
      <input id="newClient" placeholder="Emri i klientit" />
      <input id="newProduct" placeholder="Programi (p.sh. ArkaPro)" />
      <select id="newDays">
        <option value="30">1 muaj</option>
        <option value="90">3 muaj</option>
        <option value="182">6 muaj</option>
        <option value="365" selected>12 muaj</option>
      </select>
    </div>
    <button class="btn-primary" id="createBtn" onclick="createLicense()">Krijo Licencën</button>
  </div>

  <div class="card" style="padding:0; overflow-x:auto;">
    <table>
      <thead>
        <tr>
          <th></th><th>Klienti</th><th>Programi</th><th>Çelësi</th><th>Skadon</th><th>Ditë Mbetur</th><th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div id="toast"></div>

<script>
let ADMIN_KEY = localStorage.getItem("licenseAdminKey") || "";

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2200);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", "x-admin-key": ADMIN_KEY, ...(opts.headers||{}) },
  });
  if (res.status === 401) { localStorage.removeItem("licenseAdminKey"); showGate(); throw new Error("unauthorized"); }
  return res.json();
}

function showGate() {
  document.getElementById("gate").style.display = "block";
  document.getElementById("app").style.display = "none";
}
function showApp() {
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  refresh();
}

function login() {
  ADMIN_KEY = document.getElementById("adminKeyInput").value.trim();
  if (!ADMIN_KEY) return;
  localStorage.setItem("licenseAdminKey", ADMIN_KEY);
  showApp();
}

function fmtDate(ms) {
  return new Date(ms).toLocaleDateString("sq-AL", { year: "numeric", month: "short", day: "numeric" });
}

async function refresh() {
  let list;
  try { list = await api("/api/admin/licenses"); } catch { return; }
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  list.forEach((lic) => {
    const tr = document.createElement("tr");
    const pillClass = lic.revoked ? "bad" : lic.daysLeft <= 0 ? "bad" : lic.daysLeft <= 14 ? "warn" : "ok";
    const pillText = lic.revoked ? "E revokuar" : lic.daysLeft <= 0 ? "Skaduar" : `${lic.daysLeft} ditë`;
    tr.innerHTML = `
      <td><span class="dot ${lic.online ? "on" : "off"}" title="${lic.online ? "Online" : "Offline"}"></span></td>
      <td class="editable" data-field="clientName" data-id="${lic.id}" title="Kliko për të ndryshuar">${lic.clientName}</td>
      <td class="editable" data-field="product" data-id="${lic.id}" title="Kliko për të ndryshuar">${lic.product}</td>
      <td class="key" title="Kliko për të kopjuar" onclick="copyKey('${lic.licenseKey}')">${lic.licenseKey}</td>
      <td>${fmtDate(lic.expiresAt)}</td>
      <td><span class="pill ${pillClass}">${pillText}</span></td>
      <td>
        <div class="row-actions">
          <button class="btn-ghost" onclick="extend(this,'${lic.id}',30)">+1M</button>
          <button class="btn-ghost" onclick="extend(this,'${lic.id}',-30)">-1M</button>
          <button class="btn-ghost" onclick="extend(this,'${lic.id}',90)">+3M</button>
          <button class="btn-ghost" onclick="extend(this,'${lic.id}',182)">+6M</button>
          <button class="btn-ghost" onclick="extend(this,'${lic.id}',365)">+12M</button>
          <button class="btn-ghost" onclick="revoke('${lic.id}')">${lic.revoked ? "Rikthe" : "Revoko"}</button>
          <button class="btn-danger" onclick="del('${lic.id}')">Fshi</button>
        </div>
      </td>`;
    tbody.appendChild(tr);
  });
}

function copyKey(key) {
  navigator.clipboard.writeText(key);
  toast("Çelësi u kopjua: " + key);
}

// --- Editim inline i klientit/programit (pa fshi/rikrijo licencën) ---
document.getElementById("tbody").addEventListener("click", (e) => {
  const cell = e.target.closest(".editable");
  if (!cell || cell.querySelector("input")) return; // tashmë në edit
  const oldValue = cell.textContent;
  const id = cell.dataset.id, field = cell.dataset.field;
  cell.innerHTML = `<input type="text" value="${oldValue.replace(/"/g, '&quot;')}" />`;
  const input = cell.querySelector("input");
  input.focus();
  input.select();

  let done = false;
  const save = async () => {
    if (done) return;
    done = true;
    const newValue = input.value.trim();
    if (!newValue || newValue === oldValue) { cell.textContent = oldValue; return; }
    cell.textContent = newValue; // optimistike, kthehet mbrapsht nga refresh() nëse dështon
    try {
      await api(`/api/admin/licenses/${id}`, { method: "PUT", body: JSON.stringify({ [field]: newValue }) });
      toast("U ruajt");
    } catch { toast("Gabim gjatë ruajtjes"); }
    refresh();
  };
  input.addEventListener("blur", save);
  input.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") input.blur();
    if (ev.key === "Escape") { done = true; cell.textContent = oldValue; }
  });
});

async function createLicense() {
  const clientName = document.getElementById("newClient").value.trim();
  const product = document.getElementById("newProduct").value.trim();
  const durationDays = document.getElementById("newDays").value;
  if (!clientName || !product) { toast("Vendos klientin dhe programin"); return; }
  const btn = document.getElementById("createBtn");
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    const lic = await api("/api/admin/licenses", {
      method: "POST",
      body: JSON.stringify({ clientName, product, durationDays }),
    });
    document.getElementById("newClient").value = "";
    document.getElementById("newProduct").value = "";
    toast("Licenca u krijua: " + lic.licenseKey);
    refresh();
  } finally {
    btn.disabled = false;
  }
}

async function extend(btn, id, days) {
  if (btn.disabled) return; // mbrojtje nga dopio-klik (p.sh. +1M i shtuar 2 herë gabimisht)
  btn.disabled = true;
  try {
    await api(`/api/admin/licenses/${id}/extend`, { method: "POST", body: JSON.stringify({ days }) });
    toast((days > 0 ? "+" : "") + days + " ditë u aplikuan");
    refresh();
  } finally {
    setTimeout(() => { btn.disabled = false; }, 800);
  }
}
async function revoke(id) {
  await api(`/api/admin/licenses/${id}/revoke`, { method: "POST" });
  refresh();
}
async function del(id) {
  if (!confirm("Ta fshij përgjithmonë këtë licencë?")) return;
  await api(`/api/admin/licenses/${id}`, { method: "DELETE" });
  refresh();
}

if (ADMIN_KEY) showApp(); else showGate();
setInterval(() => { if (document.getElementById("app").style.display !== "none") refresh(); }, 15000);
</script>
</body>
</html>
